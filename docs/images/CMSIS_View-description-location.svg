<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title description">
  <title id="title">Location of the CMSIS refresh indication in VS Code</title>
  <desc id="description">Illustrative VS Code sidebar with a single CMSIS view open. The refresh indication appears in the merged container title above the solution tree. The view description is hidden.</desc>
  <rect width="960" height="450" fill="#f4f5f7"/>
  <text x="36" y="39" fill="#243047" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">Where the refresh indication appears</text>
  <text x="36" y="62" fill="#637083" font-family="Segoe UI, sans-serif" font-size="13">Illustrative mock, not a live VS Code screenshot</text>

  <rect x="36" y="82" width="550" height="332" fill="#1f1f1f" stroke="#414141"/>
  <rect x="36" y="82" width="49" height="332" fill="#252526"/>
  <rect x="36" y="146" width="49" height="48" fill="#37373d"/>
  <rect x="36" y="146" width="3" height="48" fill="#75beff"/>
  <text x="50" y="177" fill="#dddddd" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">C</text>

  <rect x="157" y="92" width="331" height="31" rx="3" fill="#183b43" stroke="#4cc2d3" stroke-width="2"/>
  <text x="105" y="114" fill="#d7d7d7" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">CMSIS: </text>
  <text x="168" y="114" fill="#eeeeee" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600">MySolution - Refresh needed</text>
  <path d="M85 128 H586" stroke="#383838"/>
  <text x="106" y="156" fill="#aaaaaa" font-family="Segoe UI, sans-serif" font-size="12">SOLUTION TREE</text>
  <path d="M112 180 l5 5 5 -5" fill="none" stroke="#bbbbbb"/>
  <text x="135" y="186" fill="#dddddd" font-family="Segoe UI, sans-serif" font-size="13">Project</text>
  <path d="M137 206 l5 5 5 -5" fill="none" stroke="#bbbbbb"/>
  <text x="160" y="212" fill="#dddddd" font-family="Segoe UI, sans-serif" font-size="13">Sources</text>
  <text x="160" y="237" fill="#dddddd" font-family="Segoe UI, sans-serif" font-size="13">Components</text>

  <path d="M488 107 H630 V136 H657" fill="none" stroke="#16849a" stroke-width="2"/>
  <path d="M656 136 l-8 -5 v10 z" fill="#16849a"/>
  <text x="668" y="132" fill="#183844" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Merged container title</text>
  <text x="668" y="157" fill="#415363" font-family="Segoe UI, sans-serif" font-size="13">TreeView.title is shown here.</text>
  <text x="668" y="192" fill="#415363" font-family="Segoe UI, sans-serif" font-size="13">The single view's own header</text>
  <text x="668" y="215" fill="#415363" font-family="Segoe UI, sans-serif" font-size="13">and TreeView.description are hidden.</text>
  <text x="668" y="272" fill="#637083" font-family="Segoe UI, sans-serif" font-size="13">Widen the sidebar if the title</text>
  <text x="668" y="293" fill="#637083" font-family="Segoe UI, sans-serif" font-size="13">is truncated.</text>
</svg>
