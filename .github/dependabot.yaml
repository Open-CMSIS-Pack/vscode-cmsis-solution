version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@open-cmsis-pack"
    token: ${{secrets.GH_PACKAGES_TOKEN}}

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "02:00"
    cooldown:
      default-days: 3

    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain dependencies for the JavaScript package
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-github
    schedule:
      interval: "monthly"
      time: "02:00"
    cooldown:
      default-days: 3
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-production-minor-patch:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-development-minor-patch:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "cmsis-csolution"  # Ignore the workspace root package
      - dependency-name: "@types/vscode"
      - dependency-name: "react"
        update-types:
        - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
        - version-update:semver-major
      - dependency-name: "jest"
        update-types:
        - version-update:semver-major
      - dependency-name: "@types/jest"
        update-types:
        - version-update:semver-major
      - dependency-name: "nock"
        update-types:
        - version-update:semver-major
