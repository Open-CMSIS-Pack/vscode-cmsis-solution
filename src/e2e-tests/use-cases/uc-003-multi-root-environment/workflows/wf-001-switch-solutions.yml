id: UC-003
title: Isolate CMSIS Environment in a Multi-root Workspace
issue: https://github.com/Open-CMSIS-Pack/vscode-cmsis-solution/issues/684
workflows:
    - id: WF-001
      title: Switch between nested solutions in different workspace folders
      automation:
          test: src/e2e-tests/use-cases/uc-003-multi-root-environment/uc-003-multi-root-environment.test.ts
          fixture: src/e2e-tests/use-cases/uc-003-multi-root-environment/fixtures/wf-001-switch-solutions.yml
      steps:
          - Open a fresh multi-root workspace with a nested solution in each
            folder.
          - Discover the valid default in the second folder after ignoring a
            stale first-folder default.
          - Verify the second folder's environment and target selection are
            persisted in that folder.
          - Select the first, second, and first solutions using Open Solution in
            Workspace.
          - Verify each folder retains its own environment, pack root, and
            target selection.
          - Reload the workspace and verify the active solution and folder
            environment are restored.
      validates:
          - resource-scoped environment configuration in a real VS Code
            extension host
          - default solution discovery across roots
          - independent .vscode/cmsis.json and .cmsis/tools-environment.yml files
          - nested solution paths relative to their owning root
          - switching and reload persistence
