workflow: WF-001
board: V2M-MPS3-SSE-300-FVP
device: SSE-300-MPS3 
reference_application: Blinky (CMSIS-RTOS2 based Blinky application using FreeRTOS and pack arm::cmsis-freertos@11.3.0)
solution_name_prefix: e2e_refapp_fvp_solution

fvp:
  pack: ARM::AVH_FVP
  debug_adapter: Arm-FVP
  model: FVP_Corstone_SSE-300
  config_file: ./board/Corstone-300/fvp_config.txt
  misc: --simlimit 25

arm_tools:
  environment: Arm Virtual Hardware for Cortex®-M based on Fast Models
  version: 11.31.28

expected_run:
  terminal: Run
  command_contains:
    - FVP_Corstone_SSE-300
    - board/Corstone-300/fvp_config.txt
    - --simlimit 25
    - out/Blinky/SSE-300-MPS3/Debug/Blinky.hex
  output_contains:
    - Blinky example

expected_files:
  created:
    - "./Blinky.csolution.yml"
    - "./Blinky/Blinky.c"
    - "./Blinky/Blinky.cproject.yml"
  built:
    - ./out/Blinky+SSE-300-MPS3.cbuild-run.yml
    - ./out/Blinky/SSE-300-MPS3/Debug/Blinky.axf
    - ./out/Blinky/SSE-300-MPS3/Debug/Blinky.hex
