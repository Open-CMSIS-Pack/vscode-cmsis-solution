repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    # Convert CRLF/CR line endings to LF
    - id: mixed-line-ending
      args: [--fix=lf]
      exclude: '^test-data/|.*\.(png|svg|bat)$'

    # Ensure files end with exactly one newline
    - id: end-of-file-fixer
      exclude: '^test-data/|.*\.(png|svg|bat)$'
